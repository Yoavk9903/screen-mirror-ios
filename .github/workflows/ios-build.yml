name: iOS build

# Builds the iPhone app in the cloud, on a GitHub-hosted Mac — no physical/rented Mac
# needed. First milestone: compile for the Simulator only (no Apple Developer signing
# required yet). Once there's a paid Apple Developer account + signing certificate, this
# workflow will be extended to archive and upload a real IPA to TestFlight.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode_*.app 2>/dev/null
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ScreenMirror.xcodeproj \
            -scheme ScreenMirrorSender \
            2>&1 | tee resolve.log

      - name: Build for Simulator (no signing needed)
        run: |
          set -o pipefail
          xcodebuild \
            -project ScreenMirror.xcodeproj \
            -scheme ScreenMirrorSender \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Publish log tail
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          set -x
          CURL="curl -s --max-time 20"

          { echo "=== resolve.log (tail) ==="; tail -n 80 resolve.log 2>/dev/null; \
            echo "=== build.log (tail) ==="; tail -n 150 build.log 2>/dev/null; } > /tmp/last-failure.log

          REPO="${{ github.repository }}"
          PATH_IN_REPO="ci-logs/last-failure.log"
          CONTENT_B64=$(base64 < /tmp/last-failure.log | tr -d '\n')

          MAIN_SHA=$($CURL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/heads/main" | jq -r '.object.sha')
          $CURL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-logs\",\"sha\":\"$MAIN_SHA\"}" > /dev/null

          EXISTING_SHA=$($CURL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/$PATH_IN_REPO?ref=ci-logs" \
            | jq -r '.sha // empty')

          if [ -n "$EXISTING_SHA" ]; then
            BODY=$(jq -n --arg msg "CI failure log from run ${{ github.run_id }}" \
              --arg content "$CONTENT_B64" --arg branch "ci-logs" --arg sha "$EXISTING_SHA" \
              '{message:$msg, content:$content, branch:$branch, sha:$sha}')
          else
            BODY=$(jq -n --arg msg "CI failure log from run ${{ github.run_id }}" \
              --arg content "$CONTENT_B64" --arg branch "ci-logs" \
              '{message:$msg, content:$content, branch:$branch}')
          fi

          echo "$BODY" > /tmp/body.json
          $CURL -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/$PATH_IN_REPO" \
            -d @/tmp/body.json

          echo "log-publish step finished (best-effort; does not fail the job)"
          exit 0

  testflight:
    # Archives a signed Release build and uploads it to TestFlight. Dormant until the Apple
    # Developer account is active and these are added under this repo's Settings -> Secrets
    # and variables -> Actions:
    # (The Team ID is not secret and lives in project.yml.)
    #   Secret    APPSTORE_API_KEY_ID    - App Store Connect API key ID
    #   Secret    APPSTORE_API_ISSUER_ID - App Store Connect API issuer ID
    #   Secret    APPSTORE_API_KEY_P8    - full text of the downloaded AuthKey_XXXX.p8 file
    # Signing uses Apple's cloud-managed certificates via the API key
    # (-allowProvisioningUpdates), so no .p12 / .mobileprovision files are needed.
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: macos-14
    env:
      APPLE_TEAM_ID: 2PW8CJAFRC
      API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether App Store Connect secrets are configured
        id: check
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_P8" ]; then
            echo "No App Store Connect secrets yet - skipping TestFlight upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.check.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.skip != 'true'
        run: xcodegen generate

      - name: Select the newest available Xcode
        if: steps.check.outputs.skip != 'true'
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Write App Store Connect API key
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_P8" > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Archive (signed)
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          xcodebuild -project ScreenMirror.xcodeproj \
            -scheme ScreenMirrorSender \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ScreenMirror.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${API_KEY_ID}.p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive 2>&1 | tee archive.log

      - name: Export and upload to TestFlight
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ScreenMirror.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${API_KEY_ID}.p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            2>&1 | tee export.log
